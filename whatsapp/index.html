<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#17a765">
  <title>Abrindo o WhatsApp | Protásio Gás e Água</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: #10213a;
      background: #f7faff;
    }
    main {
      width: min(100%, 480px);
      text-align: center;
      background: #fff;
      border: 1px solid #dce6f1;
      border-radius: 22px;
      padding: 36px 28px;
      box-shadow: 0 20px 55px rgba(4, 59, 123, .12);
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #17a765;
      color: #fff;
      font-size: 30px;
      font-weight: 900;
    }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { margin: 0 0 22px; color: #5e6d80; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 12px 22px;
      border-radius: 999px;
      background: #17a765;
      color: #fff;
      text-decoration: none;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">✓</div>
    <h1>Abrindo o WhatsApp…</h1>
    <p>Você será direcionado para conversar com a Protásio Gás e Água.</p>
    <a id="continue" href="https://wa.me/5551984298427">Continuar para o WhatsApp</a>
  </main>

  <script>
  (() => {
    'use strict';

    const WHATSAPP_NUMBER = '5551984298427';
    const params = new URLSearchParams(window.location.search);
    const message = params.get('text') || 'Olá! Quero falar com a Protásio Gás e Água.';
    const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
    const continueLink = document.getElementById('continue');

    if (continueLink) continueLink.href = whatsappUrl;

    // Pequeno intervalo para permitir que a página de confirmação carregue antes do redirecionamento.
    window.setTimeout(() => {
      window.location.replace(whatsappUrl);
    }, 700);
  })();
  </script>
</body>
</html>
